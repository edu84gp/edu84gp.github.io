  <text x="32" y="52" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="26" font-weight="700" fill="#f9fafb">De una oferta a una candidatura</text>
  <text x="32" y="82" font-family="system-ui, -apple-system, 'Segoe UI', sans-serif" font-size="15" fill="#9ca3af">Un flujo reproducible con agentes y MCPs</text>

