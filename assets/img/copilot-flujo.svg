<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 1000" role="img" aria-labelledby="titulo descripcion">
  <title id="titulo">Flujo de AI Job Search Copilot</title>
  <desc id="descripcion">Seis pasos: oferta, análisis de encaje, CV adaptado, carta y email, registro en SQLite y preparación de la entrevista. El sistema reúne 15 agentes, 10 MCPs, 20 comandos y 14 skills.</desc>
